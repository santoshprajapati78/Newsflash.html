<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>NewsFlash — Latest News</title>
<style>
:root{--ink:#111827;--muted:#667085;--paper:#f3f5f9;--red:#e63946;--line:#e6eaf0;--navy:#101827}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}.top{background:linear-gradient(135deg,#101827 0%,#17253b 100%);color:#fff;padding:17px 16px 15px;position:sticky;top:0;z-index:5;box-shadow:0 5px 24px #11182725}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-weight:950;font-size:27px;letter-spacing:-1.2px}.logo span{color:#ff5964}.live{font-size:11px;background:#253044;border-radius:20px;padding:7px 10px;color:#ffb4ba}.tagline{font-size:12px;color:#cbd5e1;margin-top:4px}.search{display:flex;margin-top:13px;gap:8px}.search input{min-width:0;flex:1;border:1px solid #374151;border-radius:13px;padding:13px;background:#1f2937;color:#fff;outline:none}.search button,.refresh{border:0;border-radius:13px;background:var(--red);color:white;padding:0 15px;font-weight:750;box-shadow:0 4px 10px #e6394622}.cats{display:flex;gap:8px;overflow:auto;padding:13px 14px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);scrollbar-width:none;position:sticky;top:126px;z-index:4}.cats button{white-space:nowrap;border:1px solid var(--line);background:white;padding:9px 13px;border-radius:22px;color:#344054;font-weight:650;font-size:13px}.cats button.active{background:#111827;color:white;border-color:#111827}.wrap{max-width:960px;margin:auto;padding:18px 14px 100px}.headline{display:flex;justify-content:space-between;align-items:center;margin:7px 2px 12px}.headline h2{font-size:18px;margin:0;letter-spacing:-.4px}.small{font-size:11px;color:var(--muted)}.hero{background:#fff;border-radius:20px;overflow:hidden;border:1px solid var(--line);margin-bottom:16px;box-shadow:0 8px 28px #10182708}.hero-art{height:155px;background:linear-gradient(125deg,#14213d,#e63946);display:flex;align-items:flex-end;padding:16px;color:#fff;position:relative;overflow:hidden}.hero-art:before{content:"";position:absolute;width:220px;height:220px;border:35px solid #ffffff20;border-radius:50%;right:-30px;top:-95px}.hero-art:after{content:"NEWS";font-size:68px;font-weight:950;letter-spacing:-5px;position:absolute;right:10px;bottom:0;color:#ffffff1c}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}.hero-body{padding:15px}.hero h1{font-size:21px;line-height:1.25;letter-spacing:-.7px;margin:8px 0}.hero p{color:#667085;line-height:1.55;font-size:13px;margin:0}.meta{display:flex;justify-content:space-between;align-items:center;color:#7b8494;font-size:11px;margin-top:13px}.cards{display:grid;grid-template-columns:1fr;gap:11px}.story{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 4px 18px #10182706}.thumb{flex:0 0 76px;height:76px;border-radius:12px;background:#eef2ff;display:grid;place-items:center;font-size:29px}.story h3{font-size:15px;line-height:1.35;margin:5px 0 7px;letter-spacing:-.25px}.story p{font-size:12px;color:var(--muted);line-height:1.45;margin:0}.story .meta{margin-top:9px}.pill{font-size:10px;font-weight:800;color:#d92d3a;background:#fff0f1;border-radius:5px;padding:4px 6px}.storytop{display:flex;justify-content:space-between;gap:8px;align-items:center}.save{border:0;background:#f3f4f6;border-radius:8px;padding:6px 8px;color:#667085}.status{text-align:center;padding:25px 10px;color:var(--muted);font-size:13px}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:8}.bottom button{border:0;background:none;color:#667085;font-size:10px;display:grid;gap:4px;justify-items:center}.bottom b{font-size:19px;font-weight:500}.bottom button.active{color:var(--red)}.error{background:#fff8e8;color:#854d0e;padding:12px;border-radius:12px;font-size:12px;margin-bottom:12px;display:none}.refresh{padding:9px 12px;border-radius:9px;font-size:12px}.foot{text-align:center;color:#98a2b3;font-size:11px;padding:20px 0 5px}
@media(min-width:650px){.top{padding-left:max(20px,calc((100vw - 870px)/2));padding-right:max(20px,calc((100vw - 870px)/2))}.cats{justify-content:center;top:124px}.wrap{padding-top:22px}.hero{display:grid;grid-template-columns:42% 1fr}.hero-art{height:auto;min-height:235px}.hero h1{font-size:27px}.cards{grid-template-columns:1fr 1fr}.story{min-height:145px}.thumb{flex-basis:68px;height:68px}}
</style></head>
<body>
<header class="top"><div class="brand"><div><div class="logo">News<span>Flash</span> ⚡</div><div class="tagline">खबरें तेज़, साफ़ और सबसे पहले</div></div><div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end"><select id="languageSelect" aria-label="Choose language" style="max-width:112px;background:#253044;color:#fff;border:1px solid #374151;border-radius:9px;padding:8px;font-size:12px"><option value="hi">हिन्दी</option><option value="en">English</option></select><span class="live">● LIVE UPDATES</span></div></div>
<form class="search" id="searchForm"><input id="searchInput" placeholder="खबर खोजें... (जैसे India, cricket)" aria-label="खबर खोजें"><button type="submit">खोजें</button></form></header>
<nav class="cats" id="cats"><button class="active" data-cat="all">टॉप न्यूज़</button><button data-cat="India">🇮🇳 भारत</button><button data-cat="World">🌍 दुनिया</button><button data-cat="Technology">💻 टेक</button><button data-cat="Business">📈 बिज़नेस</button><button data-cat="Sports">🏏 खेल</button><button data-cat="Entertainment">🎬 मनोरंजन</button></nav>
<main class="wrap"><div class="headline"><h2 id="sectionTitle">आज की बड़ी खबरें</h2><button class="refresh" id="refresh">↻ Refresh</button></div>
<div id="error" class="error"></div><section id="hero"></section><div class="headline"><h2>लेटेस्ट अपडेट्स</h2><span class="small" id="count"></span></div><section class="cards" id="stories"></section><div id="status" class="status">ताज़ा खबरें लोड हो रही हैं…</div><div class="foot">NewsFlash • News belongs to its original publishers.<br>RSS availability depends on external services.</div></main>
<nav class="bottom"><button class="active" data-tab="home"><b>⌂</b>होम</button><button data-tab="saved"><b>♡</b>सेव्ड</button><button data-tab="search"><b>⌕</b>खोजें</button><button data-tab="about"><b>ⓘ</b>जानकारी</button></nav>
<script>
const feeds={
India:{name:"भारत",url:"https://feeds.bbci.co.uk/news/world/asia/india/rss.xml",icon:"🇮🇳"},
World:{name:"दुनिया",url:"https://feeds.bbci.co.uk/news/world/rss.xml",icon:"🌍"},
Technology:{name:"टेक्नोलॉजी",url:"https://feeds.bbci.co.uk/news/technology/rss.xml",icon:"💻"},
Business:{name:"बिज़नेस",url:"https://feeds.bbci.co.uk/news/business/rss.xml",icon:"📈"},
Sports:{name:"खेल",url:"https://feeds.bbci.co.uk/sport/rss.xml",icon:"🏏"},
Entertainment:{name:"मनोरंजन",url:"https://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml",icon:"🎬"}
};
const proxy=u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u);
let category="all",query="",allStories=[],saved=JSON.parse(localStorage.getItem("newsflash-saved")||"[]"),tab="home",lastLoaded=0;
const $=id=>document.getElementById(id);
function clean(s){let d=document.createElement("div");d.innerHTML=s||"";return (d.textContent||"").trim()}
function ago(date){let n=Math.max(1,Math.floor((Date.now()-new Date(date).getTime())/60000));if(!Number.isFinite(n)||n<0)return "हाल ही में";return n<60?n+" मिनट पहले":n<1440?Math.floor(n/60)+" घंटे पहले":Math.floor(n/1440)+" दिन पहले"}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function articleCategory(a){return a.category||"India"}
function filtered(){let list=tab==="saved"?allStories.filter(a=>saved.includes(a.link)):allStories;return list.filter(a=>(category==="all"||articleCategory(a)===category)&&(!query||(a.title+" "+a.description+" "+a.source).toLowerCase().includes(query.toLowerCase())))}
let language=localStorage.getItem("newsflash-language")||"en";
const words={
 hi:{tagline:"खबरें तेज़, साफ़ और सबसे पहले",search:"खबर खोजें... (जैसे India, cricket)",searchBtn:"खोजें",all:"टॉप न्यूज़",India:"🇮🇳 भारत",World:"🌍 दुनिया",Technology:"💻 टेक",Business:"📈 बिज़नेस",Sports:"🏏 खेल",Entertainment:"🎬 मनोरंजन",today:"आज की बड़ी खबरें",latest:"लेटेस्ट अपडेट्स",refresh:"↻ Refresh",loading:"ताज़ा खबरें लोड हो रही हैं…",count:"खबरें",saved:"आपकी सेव्ड खबरें",about:"NewsFlash के बारे में",top:"बड़ी खबर",read:"पूरी खबर ↗",readShort:"पढ़ें ↗",savedLabel:"खबर सेव करें",empty:"इस फ़िल्टर में खबरें नहीं मिलीं। दूसरी कैटेगरी या शब्द आज़माएँ।",footer:"NewsFlash • News belongs to its original publishers.",aboutTitle:"खबरें तेज़, साफ़ और आसान",aboutBody:"यह मोबाइल-फ्रेंडली डेमो RSS न्यूज़ फ़ीड से खबरें लाता है। HTML, CSS और JavaScript से फ्रंटएंड बनाया गया है। इस single-file संस्करण में अलग Node.js backend शामिल नहीं है।"},
 en:{tagline:"Fast, clear news — all in one place",search:"Search news... (e.g. India, cricket)",searchBtn:"Search",all:"Top News",India:"🇮🇳 India",World:"🌍 World",Technology:"💻 Tech",Business:"📈 Business",Sports:"🏏 Sports",Entertainment:"🎬 Entertainment",today:"Top Stories Today",latest:"Latest Updates",refresh:"↻ Refresh",loading:"Loading latest news…",count:"stories",saved:"Your Saved Stories",about:"About NewsFlash",top:"Top Story",read:"Read full story ↗",readShort:"Read ↗",savedLabel:"Save story",empty:"No stories match this filter. Try another category or search term.",footer:"NewsFlash • News belongs to its original publishers.",aboutTitle:"Fast, clear and easy news",aboutBody:"This mobile-friendly demo fetches stories from RSS news feeds. The frontend uses HTML, CSS and JavaScript. This single-file version does not include a separate Node.js backend."}
};
function w(k){return words[language][k]||words.hi[k]||k}
function applyLanguage(){
 language=$("languageSelect").value;localStorage.setItem("newsflash-language",language);
 document.documentElement.lang=language;
 document.querySelector(".tagline").textContent=w("tagline");
 document.querySelector(".live").textContent=language==="en"?"● LIVE UPDATES":"● LIVE UPDATES";
 $("searchInput").placeholder=w("search");$("searchInput").setAttribute("aria-label",w("search"));
 $("searchForm").querySelector("button").textContent=w("searchBtn");
 document.querySelectorAll("#cats button").forEach(b=>b.textContent=w(b.dataset.cat));
 $("refresh").textContent=w("refresh");
 render();
}
function render(){let list=filtered();$("count").textContent=list.length+" "+w("count");$("sectionTitle").textContent=tab==="saved"?w("saved"):tab==="about"?w("about"):category==="all"?w("today"):(language==="en"?({India:"India",World:"World",Technology:"Technology",Business:"Business",Sports:"Sports",Entertainment:"Entertainment"}[category]||w("latest")):(feeds[category]?.name||w("latest")));
if(tab==="about"){$("hero").innerHTML=`<div class="hero"><div class="hero-art"><span class="eyebrow">ABOUT NEWSFLASH</span></div><div class="hero-body"><h1>${w("aboutTitle")}</h1><p>${w("aboutBody")}</p><p style="margin-top:10px">${language==="en"?"News content belongs to its original publishers.":"खबरों की सामग्री उनके मूल प्रकाशकों की है।"}</p></div></div>`;$("stories").innerHTML="";$("status").textContent="";return}
let first=list[0];$("hero").innerHTML=first&&tab!=="saved"?`<article class="hero"><div class="hero-art"><div><div class="eyebrow">⚡ ${w("top")} · ${escapeHTML(feeds[articleCategory(first)]?.name||"News")}</div></div></div><div class="hero-body"><span class="pill">${w("top")}</span><h1>${escapeHTML(first.title)}</h1><p>${escapeHTML(first.description||(language==="en"?"Open the original source to read the full story.":"पूरी खबर पढ़ने के लिए मूल स्रोत खोलें।"))}</p><div class="meta"><span>${escapeHTML(first.source)} · ${ago(first.date)}</span><a href="${escapeHTML(first.link)}" target="_blank" rel="noopener" style="color:#e63946;font-weight:800;text-decoration:none">${w("read")}</a></div></div></article>`:"";
$("stories").innerHTML=list.slice(tab==="saved"?0:1).map(a=>`<article class="story"><div class="thumb">${feeds[articleCategory(a)]?.icon||"📰"}</div><div style="min-width:0;flex:1"><div class="storytop"><span class="pill">${escapeHTML(feeds[articleCategory(a)]?.name||"News")}</span><button class="save" data-save="${escapeHTML(a.link)}" aria-label="${w("savedLabel")}">${saved.includes(a.link)?"♥":"♡"}</button></div><h3>${escapeHTML(a.title)}</h3><p>${escapeHTML(a.description||"ताज़ा अपडेट पढ़ें।")}</p><div class="meta"><span>${escapeHTML(a.source)} · ${ago(a.date)}</span><a href="${escapeHTML(a.link)}" target="_blank" rel="noopener" style="color:#e63946;text-decoration:none;font-weight:800">${w("readShort")}</a></div></div></article>`).join("");
$("stories").querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{let link=b.dataset.save;saved=saved.includes(link)?saved.filter(x=>x!==link):[...saved,link];localStorage.setItem("newsflash-saved",JSON.stringify(saved));render()});
$("status").textContent=list.length?(language==="en"?"Stories selected for you":"आपके लिए चुनी गई खबरें"):w("empty")}
async function loadNews(){
 $("refresh").textContent="लोड हो रहा…";$("refresh").disabled=true;
 $("status").textContent=language==="en"?"Checking live news connection…":"लाइव न्यूज़ कनेक्शन की जाँच हो रही है…";$("error").style.display="none";
 const fetchTimeout=async url=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{return await fetch(url,{cache:"no-store",signal:c.signal})}finally{clearTimeout(t)}};
 const getFeed=async(cat,f)=>{
   const target=encodeURIComponent(f.url);
   for(const url of ["https://api.allorigins.win/raw?url="+target,"https://corsproxy.io/?url="+target]){
     try{const r=await fetchTimeout(url);if(!r.ok)continue;const body=await r.text();if(!body.includes("<item"))continue;
       const xml=new DOMParser().parseFromString(body,"text/xml");if(xml.querySelector("parsererror"))continue;
       const items=[...xml.querySelectorAll("item")].slice(0,12).map(it=>({title:clean(it.querySelector("title")?.textContent)||"News update",description:clean(it.querySelector("description")?.textContent).slice(0,240),link:it.querySelector("link")?.textContent?.trim()||"https://www.bbc.com/news",date:it.querySelector("pubDate")?.textContent||new Date().toISOString(),source:"BBC "+f.name,category:cat}));
       if(items.length)return items;
     }catch(e){console.warn("Feed unavailable:",cat,e)}
   }return [];
 };
 try{
   const results=await Promise.all(Object.entries(feeds).map(([cat,f])=>getFeed(cat,f))),combined=results.flat();
   if(combined.length){allStories=combined.sort((a,b)=>new Date(b.date)-new Date(a.date));lastLoaded=Date.now();render()}
   else{$("error").style.display="block";$("error").textContent=language==="en"?"Live news feed is unavailable right now. Demo stories are shown below. Check your internet and try Refresh again later.":"लाइव न्यूज़ फ़ीड अभी उपलब्ध नहीं है। नीचे डेमो खबरें दिखाई जा रही हैं। इंटरनेट चालू करके थोड़ी देर बाद Refresh करें।";if(!allStories.length){allStories=demoStories();render()}}
 }finally{$("refresh").textContent="↻ Refresh";$("refresh").disabled=false}
}
function demoStories(){return [{title:"NewsFlash से ताज़ा खबरें पढ़ें",description:"इंटरनेट से RSS न्यूज़ लोड करने के लिए Refresh दबाएँ। यह नमूना कार्ड है, लाइव खबर नहीं।",link:"https://www.bbc.com/news",date:new Date().toISOString(),source:"डेमो · लाइव नहीं",category:"India"},{title:"अपनी पसंद की कैटेगरी चुनें",description:"भारत, दुनिया, टेक्नोलॉजी, बिज़नेस, खेल और मनोरंजन की खबरें खोजें।",link:"https://www.bbc.com/news",date:new Date().toISOString(),source:"डेमो · लाइव नहीं",category:"Technology"}]}
$("cats").querySelectorAll("button").forEach(b=>b.onclick=()=>{category=b.dataset.cat;tab="home";$("cats").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));render()});
$("searchForm").onsubmit=e=>{e.preventDefault();query=$("searchInput").value.trim();tab="home";render()};
$("refresh").onclick=loadNews;
$("languageSelect").value=language;$("languageSelect").onchange=applyLanguage;
document.querySelectorAll(".bottom button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(tab==="search"){$("searchInput").focus();return}if(tab==="home"){category="all";query="";$("searchInput").value="";$("cats").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x.dataset.cat==="all"))}if(tab==="saved"){category="all";query=""}document.querySelectorAll(".bottom button").forEach(x=>x.classList.toggle("active",x===b));render()});
allStories=demoStories();$("languageSelect").value=language;applyLanguage();render();loadNews();setInterval(()=>{if(document.visibilityState==="visible"&&Date.now()-lastLoaded>10*60*1000)loadNews()},60000);
</script></body></html>
